version: '3.8'

services:
  rasta-auto:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rasta-pakistan-archive
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:./dev.db
    volumes:
      # Persist local SQLite database across container restarts
      - ./dev.db:/app/dev.db
